<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1512">
<title>司法書士 択一○×練習</title>
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="択一○×">
</head>
<body>
<div class="wrap">
  <header class="lcd-head">
    <div class="brand">
      <img src="icon-192.png" width="44" height="44" alt="">
      <div>
        <p class="kicker">司法書士</p>
        <h1>択一○×練習</h1>
      </div>
    </div>
    <p class="sub">合格ゾーン（民法・自然人）の肢です。○か×を押すと、正誤と解説が表示されます。</p>
    <nav class="tabs" role="tablist" aria-label="画面">
      <button class="tab" data-mode="practice" role="tab">練習</button>
      <button class="tab" data-mode="weak" role="tab">弱点</button>
      <button class="tab" data-mode="review" role="tab">結果</button>
    </nav>
  </header>
  <main id="app" aria-live="polite"></main>
  <footer class="foot">
    <span id="seedinfo"></span>
    <span>学習履歴はこの端末のブラウザに保存されます。</span>
  </footer>
</div>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.update();
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update(); });
    }).catch(e => console.warn("Service Worker の登録に失敗しました", e));
  });
}
</script>
</body>
</html>
